name: Auto Post to X

on:
  schedule:
    - cron: '0 4,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tweepy
        run: pip install tweepy

      - name: Publish Next Tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python bot.py

      - name: Update posts.txt queue
        run: |
          git config --global user.name "X Auto Bot"
          git config --global user.email "actions@github.com"
          git add posts.txt
          git diff --staged --quiet || git commit -m "Remove published post from queue"
          git push
